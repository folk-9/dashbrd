<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktif Kaligrafi Sci-Fi</title>
    <style>
        /* Mengatur tampilan dasar halaman */
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* Wadah utama pembungkus gambar */
        .image-container {
            position: relative;
            width: 90vmin; /* Responsif mengikuti ukuran layar terkecil */
            max-width: 600px;
            aspect-ratio: 3 / 4; /* Sesuaikan dengan rasio aspek gambar kaligrafi */
            cursor: pointer;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            transition: transform 0.3s ease;
        }

        .image-container:active {
            transform: scale(0.98); /* Efek membal saat ditekan */
        }

        /* Pengaturan dasar untuk kedua lapisan gambar */
        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none; /* Mencegah gangguan drag gambar bawaan browser */
        }

        /* Lapisan lampu mati berada di paling bawah */
        .lamp-off {
            z-index: 1;
            opacity: 1;
        }

        /* Lapisan lampu menyala berada di atas lapisan mati */
        .lamp-on {
            z-index: 2;
            opacity: 0; /* Awalnya tersembunyi (mati) */
        }

        /* Class aktif untuk memunculkan efek lampu menyala */
        .image-container.active .lamp-on {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Wadah Interaktif -->
    <div class="image-container" id="artboard">
        <!-- Lapisan 1: Base / Lampu Off (Gelap) -->
        <img src="lampu_off.png" alt="Kaligrafi Sci-Fi Gelap" class="layer lamp-off">
        
        <!-- Lapisan 2: Lampu On (Menyala) -->
        <img src="lampu_on.png" alt="Kaligrafi Sci-Fi Menyala" class="layer lamp-on">
    </div>

    <script>
        // Mengambil elemen kontainer gambar
        const artboard = document.getElementById('artboard');

        // Menambahkan fungsi deteksi ketukan / klik
        artboard.addEventListener('click', () => {
            // Mengubah status class 'active' (nyala/mati) secara berkala setiap kali di-tap
            artboard.classList.toggle('active');
        });
    </script>
</body>
</html>
